#      mode: always  # data.sql 실행
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB      # 최대 파일 크기
      max-request-size: 100MB   # 최대 요청 크기
      file-size-threshold: 2KB  # 메모리에 저장할 임계값

  kafka:
    #bootstrap-servers: 192.168.250.249:9092
    bootstrap-servers: 192.168.250.180:9092
    #listener:
      #type: batch # 배치 리스너 활성화
    consumer:
      #group-id: hdt-dt-server
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      #value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      max-poll-records: 1 # 한번에 1000개씩 땡겨옴
      fetch-min-size: 1048576
      fetch-max-wait: 1000ms
      properties:
        max.partition.fetch.bytes: 10485760 # 10MB

hdt:
  kafka:
    topics:
      telemetry-raw: hdt-telemetry-raw

# 파일 업로드 경로 설정
file:
  upload:
    path: uploads/3d-models
    thumbnail-path: uploads/thumbnails

# JWT 설정 (관제 시스템 최적화)
jwt:
  secret: hdt-digitaltwin-secret-key-2026-hanaDream-security-token-key-minimum-256-bits
  #expiration: 1800000              # Access Token: 30분
  expiration: 180000000              # Access Token: 3000분
  refresh-expiration: 7776000000   # Refresh Token: 90일

# 비밀번호 정책
password:
  change-period-days: 90
  min-length: 8
  require-special-char: true
  require-number: true
  require-uppercase: true

# 인증 및 세션 정책
auth:
  max-devices-per-user: 10
  allow-concurrent-sessions: true

management:
  endpoint:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true

# 로깅 설정
logging:
  level:
    com.mpole.hdt.digitaltwin: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
